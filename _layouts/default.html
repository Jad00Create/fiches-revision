<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* === RESET & BASE === */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: rgba(255, 255, 255, 0.03);
      --bg-card-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 255, 255, 0.12);
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --text-muted: #55556a;
      --accent-1: #6c5ce7;
      --accent-2: #a855f7;
      --accent-3: #06b6d4;
      --gradient-1: linear-gradient(135deg, #6c5ce7, #a855f7);
      --gradient-2: linear-gradient(135deg, #06b6d4, #6c5ce7);
      --gradient-3: linear-gradient(135deg, #a855f7, #ec4899);
      --gradient-bg: linear-gradient(180deg, #0a0a0f 0%, #0d0d1a 50%, #0a0a0f 100%);
      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 6px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
      touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(108, 92, 231, 0.15);
    }

    body {
      font-family: var(--font);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* === ANIMATED BACKGROUND === */
    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-glow::before {
      content: '';
      position: absolute;
      top: -40%;
      left: -20%;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(108, 92, 231, 0.08) 0%, transparent 70%);
      animation: float 20s ease-in-out infinite;
    }

    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: -30%;
      right: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.06) 0%, transparent 70%);
      animation: float 25s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(5%, -5%) scale(1.05); }
      66% { transform: translate(-3%, 3%) scale(0.95); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(108, 92, 231, 0.15); }
      50% { box-shadow: 0 0 40px rgba(108, 92, 231, 0.3); }
    }

    /* === NAVIGATION === */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1rem 2rem;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.6s ease;
    }

    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-primary);
    }

    .nav-logo {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-xs);
      background: var(--gradient-1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.9rem;
      color: white;
    }

    .nav-title {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .nav-links {
      display: flex;
      gap: 0.25rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      padding: 0.5rem 0.85rem;
      border-radius: var(--radius-xs);
      font-size: 0.875rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-links a:focus-visible {
      outline: 2px solid var(--accent-1);
      outline-offset: 2px;
    }

    .nav-links .nav-generer {
      background: var(--gradient-1);
      color: white;
      padding: 0.45rem 1rem;
      border-radius: 100px;
      font-weight: 700;
    }

    .nav-links .nav-generer:hover {
      opacity: 0.9;
      background: var(--gradient-1);
      color: white;
      transform: translateY(-1px);
    }

    /* === MAIN CONTENT === */
    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 8rem 2rem 4rem;
      min-height: 100vh;
    }

    /* === HERO SECTION === */
    .hero {
      text-align: center;
      padding: 4rem 0 5rem;
      animation: fadeInUp 0.8s ease;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      border-radius: 100px;
      background: rgba(108, 92, 231, 0.1);
      border: 1px solid rgba(108, 92, 231, 0.2);
      color: var(--accent-2);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 1.5rem;
    }

    .hero-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-2);
      animation: pulse-glow 2s ease infinite;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      text-wrap: balance;
    }

    .hero h1 .gradient-text {
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-size: 1.15rem;
      color: var(--text-secondary);
      max-width: 560px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
      text-wrap: balance;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.75rem;
      border-radius: 100px;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: var(--transition);
    }

    .btn:focus-visible {
      outline: 2px solid var(--accent-1);
      outline-offset: 3px;
    }

    .btn-primary {
      background: var(--gradient-1);
      color: white;
      box-shadow: 0 4px 20px rgba(108, 92, 231, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(108, 92, 231, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-hover);
      transform: translateY(-2px);
    }

    /* === CARDS GRID === */
    .section-header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeInUp 0.8s ease 0.2s both;
    }

    .section-header h2 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }

    .section-header p {
      color: var(--text-secondary);
      font-size: 1.05rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.25rem;
      margin-bottom: 4rem;
    }

    .card {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      text-decoration: none;
      color: var(--text-primary);
      transition: var(--transition);
      overflow: hidden;
      animation: fadeInUp 0.6s ease both;
    }

    .card:nth-child(1) { animation-delay: 0.1s; }
    .card:nth-child(2) { animation-delay: 0.15s; }
    .card:nth-child(3) { animation-delay: 0.2s; }
    .card:nth-child(4) { animation-delay: 0.25s; }
    .card:nth-child(5) { animation-delay: 0.3s; }
    .card:nth-child(6) { animation-delay: 0.35s; }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--card-accent, var(--gradient-1));
      opacity: 0;
      transition: var(--transition);
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card:focus-visible {
      outline: 2px solid var(--accent-1);
      outline-offset: 2px;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
      transition: var(--transition);
    }

    .card:hover .card-icon {
      transform: scale(1.1);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    .card-desc {
      color: var(--text-secondary);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .card-tag {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.25rem 0.75rem;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* Card accent colors */
    .card--maths { --card-accent: linear-gradient(135deg, #6c5ce7, #a855f7); }
    .card--physique { --card-accent: linear-gradient(135deg, #06b6d4, #3b82f6); }
    .card--nsi { --card-accent: linear-gradient(135deg, #10b981, #06b6d4); }
    .card--francais { --card-accent: linear-gradient(135deg, #f59e0b, #ef4444); }
    .card--histoire { --card-accent: linear-gradient(135deg, #8b5cf6, #6366f1); }
    .card--philo { --card-accent: linear-gradient(135deg, #ec4899, #a855f7); }
    .card--anglais { --card-accent: linear-gradient(135deg, #3b82f6, #6366f1); }

    /* === FEATURES SECTION === */
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
      margin: 4rem 0;
      animation: fadeInUp 0.8s ease 0.4s both;
    }

    .feature {
      text-align: center;
      padding: 2rem 1.5rem;
    }

    .feature-icon {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .feature h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .feature p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.6;
    }

    /* === CONTENT AREA (for fiches) === */
    .content-wrapper {
      animation: fadeInUp 0.6s ease;
    }

    .content-wrapper h1 {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .content-wrapper h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .content-wrapper h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 2rem 0 0.75rem;
    }

    .content-wrapper p {
      color: var(--text-secondary);
      margin-bottom: 1rem;
      overflow-wrap: break-word;
    }

    .content-wrapper a {
      color: var(--accent-2);
      text-decoration: none;
      transition: var(--transition);
    }

    .content-wrapper a:hover {
      color: var(--accent-1);
      text-decoration: underline;
    }

    .content-wrapper a:focus-visible {
      outline: 2px solid var(--accent-1);
      outline-offset: 2px;
      border-radius: 2px;
    }

    .content-wrapper ul, .content-wrapper ol {
      margin: 1rem 0;
      padding-left: 1.5rem;
      color: var(--text-secondary);
    }

    .content-wrapper li {
      margin-bottom: 0.5rem;
    }

    .content-wrapper strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .content-wrapper em {
      color: var(--text-muted);
      font-style: italic;
    }

    .content-wrapper hr {
      border: none;
      height: 1px;
      background: var(--border);
      margin: 2rem 0;
    }

    /* Table */
    .content-wrapper table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .content-wrapper th {
      background: rgba(108, 92, 231, 0.08);
      padding: 0.85rem 1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }

    .content-wrapper td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .content-wrapper tr:last-child td {
      border-bottom: none;
    }

    .content-wrapper tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Blockquote */
    .content-wrapper blockquote {
      border-left: 3px solid var(--accent-1);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      background: rgba(108, 92, 231, 0.05);
      border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
      color: var(--text-secondary);
    }

    /* Code */
    .content-wrapper code {
      background: rgba(255, 255, 255, 0.06);
      padding: 0.15em 0.4em;
      border-radius: var(--radius-xs);
      font-size: 0.88em;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    /* === FOOTER === */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 3rem 2rem;
      border-top: 1px solid var(--border);
      margin-top: 4rem;
    }

    footer p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: var(--transition);
    }

    footer a:hover {
      color: var(--accent-2);
    }

    /* === SKIP LINK (a11y) === */
    .skip-link {
      position: absolute;
      top: -100px;
      left: 0;
      background: var(--accent-1);
      color: white;
      padding: 0.75rem 1.5rem;
      z-index: 999;
      font-weight: 600;
      text-decoration: none;
      border-radius: 0 0 var(--radius-xs) 0;
      transition: top 0.2s ease;
    }

    .skip-link:focus {
      top: 0;
    }

    /* === REDUCED MOTION === */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* === RESPONSIVE === */
    @media (max-width: 768px) {
      nav { padding: 0.75rem 1rem; }
      .nav-links { display: none; }
      main { padding: 6rem 1.25rem 3rem; }
      .hero { padding: 2rem 0 3rem; }
      .hero h1 { font-size: 2.2rem; }
      .cards-grid { grid-template-columns: 1fr; }
      .features { grid-template-columns: 1fr; }
      .content-wrapper h1 { font-size: 1.8rem; }
    }

    @media (max-width: 480px) {
      .hero-actions { flex-direction: column; align-items: center; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <a href="#content" class="skip-link">Aller au contenu principal</a>

  <nav>
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="nav-brand">
        <div class="nav-logo">FR</div>
        <span class="nav-title">FichesRévision</span>
      </a>
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}generer/" class="nav-generer">✨ Générer</a></li>
        <li><a href="{{ '/' | relative_url }}maths/">Maths</a></li>
        <li><a href="{{ '/' | relative_url }}physique/">Physique</a></li>
        <li><a href="{{ '/' | relative_url }}nsi/">NSI</a></li>
        <li><a href="{{ '/' | relative_url }}francais/">Français</a></li>
        <li><a href="{{ '/' | relative_url }}histoire/">Histoire</a></li>
        <li><a href="{{ '/' | relative_url }}philo/">Philo</a></li>
        <li><a href="{{ '/' | relative_url }}anglais/">Anglais</a></li>
      </ul>
    </div>
  </nav>

  <main id="content">
    {{ content }}
  </main>

  <footer>
    <p>FichesRévision — Créé pour la classe de Terminale</p>
  </footer>
</body>
</html>
